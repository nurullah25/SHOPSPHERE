<mat-toolbar class="header">
  <a routerLink="/" class="brand">
    <mat-icon>storefront</mat-icon>
    <span>ShopSphere</span>
  </a>

  <nav class="nav-links">
    <a mat-button routerLink="/products" routerLinkActive="active">Shop</a>
  </nav>

  <span class="spacer"></span>

  <a mat-icon-button routerLink="/wishlist" aria-label="Wishlist">
    <mat-icon>favorite_border</mat-icon>
  </a>
  <a mat-icon-button routerLink="/cart" aria-label="Cart">
    <mat-icon>shopping_cart</mat-icon>
  </a>
  <a mat-stroked-button routerLink="/login" class="sign-in">Sign in</a>
</mat-toolbar>
